<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Jellyfin Watch Party</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="loading"><div class="spinner"></div><p>Conectando…</p></div>

  <div id="app" class="hidden">

    <!-- HOME -->
    <div id="view-home">
      <header class="app-header">
        <span class="logo">🎬</span>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="search-input" type="search" placeholder="Buscar…" autocomplete="off" autocorrect="off" spellcheck="false" />
          <button id="search-clear" class="icon-btn hidden" aria-label="Limpiar">✕</button>
        </div>
      </header>
      <div id="home-content">
        <div class="section-title">Recién añadido</div>
        <div id="recent-grid" class="grid"></div>
      </div>
      <div id="search-content" class="hidden">
        <div id="search-results" class="grid"></div>
        <div id="no-results" class="hidden center-msg">Sin resultados</div>
      </div>
    </div>

    <!-- TEMPORADAS -->
    <div id="view-seasons" class="hidden">
      <header class="app-header">
        <button class="back-btn" id="back-to-home">‹ Inicio</button>
        <span class="header-title" id="series-title"></span>
      </header>
      <div id="seasons-list" class="ep-list"></div>
    </div>

    <!-- EPISODIOS -->
    <div id="view-episodes" class="hidden">
      <header class="app-header">
        <button class="back-btn" id="back-to-seasons">‹ Temporadas</button>
        <span class="header-title" id="season-title"></span>
      </header>
      <div id="episodes-list" class="ep-list"></div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="view-player" class="hidden">
      <div class="video-wrap" id="video-wrap">

        <!-- Barra superior -->
        <div class="player-top-bar">
          <button class="player-back-btn" id="back-btn" aria-label="Volver">‹</button>
          <span id="now-playing-title"></span>
        </div>

        <!-- Vídeo -->
        <video id="video" controls preload="auto" playsinline webkit-playsinline></video>

        <!-- Barra inferior: pista de audio + fullscreen -->
        <div class="player-bottom-bar">
          <div class="player-bottom-left">
            <div class="track-selector hidden" id="audio-selector">
              <button class="track-btn" id="audio-btn" aria-haspopup="true">
                <span class="track-btn-icon">🔊</span>
                <span id="audio-label">Audio</span>
                <span class="track-chevron">▾</span>
              </button>
              <div class="track-menu hidden" id="audio-menu" role="listbox"></div>
            </div>
          </div>
          <div class="player-bottom-right">
            <button class="player-icon-btn" id="fs-btn" aria-label="Pantalla completa">⛶ Pantalla completa</button>
          </div>
        </div>

        <!-- Overlays -->
        <div id="video-error" class="video-error hidden">No se puede reproducir este contenido</div>
        <div id="audio-warn" class="audio-warn hidden">
          Sin audio — <button id="audio-retry">Stream directo</button>
        </div>
        <div id="tap-to-play" class="tap-to-play hidden">
          <div class="tap-icon">▶</div>
          <div class="tap-label">Toca para reproducir</div>
        </div>

      </div>
    </div>

  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
