<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>HomeStream Cine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="loading">
    <div class="marca">HOME<b>STREAM</b></div>
    <div class="spinner"></div>
    <p>Conectando…</p>
  </div>

  <div id="app" class="hidden">

    <!-- Barra superior (todas las vistas menos el reproductor) -->
    <header id="topbar">
      <button id="btn-atras" class="icono hidden" aria-label="Volver">‹</button>
      <div class="marca" id="btn-inicio">HOME<b>STREAM</b> <span>Cine</span></div>
      <label class="buscar">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Buscar pelis y series" autocomplete="off" spellcheck="false" />
      </label>
      <div class="gente" id="gente" title="Personas viendo en este canal">👥 <b>1</b></div>
    </header>

    <!-- INICIO -->
    <main id="v-inicio" class="vista">
      <section id="hero" class="hero"></section>
      <div id="filas"></div>
    </main>

    <!-- BÚSQUEDA -->
    <main id="v-buscar" class="vista hidden">
      <h2 class="titulo-seccion" id="buscar-titulo">Resultados</h2>
      <div id="resultados" class="rejilla"></div>
      <p id="sin-resultados" class="vacio hidden">No hay nada con ese nombre.</p>
    </main>

    <!-- FICHA -->
    <main id="v-ficha" class="vista hidden">
      <section class="ficha-cab" id="ficha-cab"></section>
      <section id="ficha-temporadas" class="hidden">
        <div class="pestanas" id="pestanas"></div>
        <div class="episodios" id="episodios"></div>
      </section>
    </main>

    <!-- REPRODUCTOR -->
    <section id="v-player" class="hidden">
      <video id="video" playsinline webkit-playsinline preload="auto"></video>
      <div id="p-spinner" class="spinner hidden"></div>
      <button id="p-grande" class="p-grande hidden" aria-label="Reproducir">▶</button>
      <div id="p-error" class="p-error hidden">
        <p>No se puede reproducir este título.</p>
        <button id="p-directo" class="boton">Probar sin convertir</button>
      </div>

      <div class="p-arriba">
        <button id="p-volver" class="icono" aria-label="Volver">‹</button>
        <div class="p-titulo"><b id="p-nombre"></b><span id="p-sub"></span></div>
        <div class="gente" id="p-gente">👥 <b>1</b></div>
      </div>

      <div class="p-abajo">
        <div class="barra" id="barra">
          <div class="barra-buffer" id="barra-buffer"></div>
          <div class="barra-hecho" id="barra-hecho"></div>
          <div class="barra-bola" id="barra-bola"></div>
          <div class="barra-tip hidden" id="barra-tip">0:00</div>
        </div>
        <div class="p-controles">
          <button id="p-play" class="icono" aria-label="Pausa">❚❚</button>
          <button id="p-menos" class="icono" aria-label="Atrás 10 segundos">↺<small>10</small></button>
          <button id="p-mas" class="icono" aria-label="Adelante 10 segundos">↻<small>10</small></button>
          <span class="tiempo"><span id="t-actual">0:00</span> / <span id="t-total">0:00</span></span>
          <span class="hueco"></span>
          <button id="p-siguiente" class="boton-sec hidden">Siguiente episodio ›</button>
          <div class="menu-audio hidden" id="menu-audio">
            <button id="p-audio" class="boton-sec">🔊 <span id="p-audio-txt">Audio</span></button>
            <div class="lista-audio hidden" id="lista-audio"></div>
          </div>
          <button id="p-vol" class="icono" aria-label="Silenciar">🔊</button>
          <button id="p-full" class="icono" aria-label="Pantalla completa">⛶</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
